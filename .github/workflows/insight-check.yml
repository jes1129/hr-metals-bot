name: 驗證 AI 行情解讀（暫時，只在 simplify-automation 分支）

# 這是為了驗證 Groq 能否產生「行情解讀」與「新聞分類」的暫時流程，驗證完就會刪除，
# 不會合併進 main。唯讀：不 commit、不部署、不動 data/ 與 docs/。
on:
  push:
    branches: [simplify-automation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴
        run: pip install httpx
      - name: 用真實 Groq 金鑰跑一次解讀與新聞分類
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONIOENCODING: utf-8
          METALS_DATA_DIR: data
        run: python scripts/check_insight_live.py

name: 供應商雷達 (功能 C · 九上科技)

on:
  schedule:
    - cron: "0 1 1 * *"       # 每月 1 號 UTC 01:00 = 台灣每月 1 號 09:00（供應商資料變動慢、政府檔大，月更即可）
  workflow_dispatch:

permissions:
  contents: write             # commit 供應商名單 + suppliers.html 回 repo
  pages: write                # 部署 GitHub Pages
  id-token: write             # Pages 部署驗證

concurrency:
  group: suppliers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 104 資料源已移除，不再需要瀏覽器——CI 裡最慢的一步（安裝 Chrome）省掉了
      - name: 安裝依賴
        run: pip install httpx anthropic

      - name: 執行供應商雷達
        env:
          METALS_DATA_DIR: data
          # 第一層放兩個**不同供應商**的免費額度，而不是同一家的兩個模型
          # ——實測到的失效彼此獨立（Gemini 回 503 壅塞、Groq 回 413 額度），
          # 同一家的兩個模型會一起被擋，不同家不會。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 第一層首選，每批 50 家
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}           # 第一層備援，每批 15 家
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 第二層，付費（目前未設定）
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_radar.py suppliers

      # 快照就是狀態留存機制：每個 commit 即一份快照，下期據此比對變化。
      # 原始檔（工廠名錄 6 MB ＋ 稅籍 186 MB）跑完即丟，不進版本控制。
      - name: 提交快照與儀表板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git commit -m "更新供應商名單 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "無變更"
          # 推送競爭重試：原料監控每日兩次，可能剛好卡在 pull 與 push 之間
          # （實測 2026-08-17 發生）。**最終失敗必須大聲失敗**——推送失敗即
          # 快照未存，下期的比對基準就是錯的，而排程卻報成功（靜默失敗）。
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "推送競爭，第 $i 次重試"
            sleep $((i * 5))
            git pull --rebase origin main || git rebase --abort || true
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::推送連續 5 次失敗，本期快照未進版本控制——下期變化偵測將無正確基準"
            exit 1
          fi

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

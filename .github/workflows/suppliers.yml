name: 供應商雷達 (功能 C · 九上科技)

on:
  schedule:
    - cron: "0 1 1 * *"       # 每月 1 號 UTC 01:00 = 台灣每月 1 號 09:00（供應商資料變動慢、政府檔大，月更即可）
  workflow_dispatch:

permissions:
  contents: write             # commit 供應商名單 + suppliers.html 回 repo
  pages: write                # 部署 GitHub Pages
  id-token: write             # Pages 部署驗證

concurrency:
  group: suppliers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 104 資料源已移除，不再需要瀏覽器——CI 裡最慢的一步（安裝 Chrome）省掉了
      - name: 安裝依賴
        run: pip install httpx anthropic

      - name: 執行供應商雷達
        env:
          METALS_DATA_DIR: data
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}           # 第一層，免費額度
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 第二層，付費
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_radar.py suppliers

      # 快照就是狀態留存機制：每個 commit 即一份快照，下期據此比對變化。
      # 原始檔（工廠名錄 6 MB ＋ 稅籍 186 MB）跑完即丟，不進版本控制。
      - name: 提交快照與儀表板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_suppliers_*.json data/runs.json docs/suppliers.html || true
          git commit -m "更新供應商名單 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "無變更"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: 供應商雷達 (功能 C · 九上科技)

on:
  schedule:
    - cron: "0 1 * * 1"       # UTC 週一 01:00 = 台灣週一 09:00
  workflow_dispatch:

permissions:
  contents: write             # commit 供應商名單 + suppliers.html 回 repo
  pages: write                # 部署 GitHub Pages
  id-token: write             # Pages 部署驗證

concurrency:
  group: suppliers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: |
          pip install playwright playwright-stealth httpx anthropic
          python -m playwright install --with-deps chrome

      - name: 執行供應商雷達
        env:
          METALS_DATA_DIR: data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 免費（推薦）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 選配，付費
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_suppliers.py

      - name: 提交名單與儀表板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/suppliers.json docs/suppliers.html || true
          git commit -m "更新供應商名單 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "無變更"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: 客戶開發雷達 (功能 D · 九上科技)

on:
  schedule:
    - cron: "0 2 1 * *"       # 每月 1 號 UTC 02:00 = 台灣每月 1 號 10:00（錯開供應商）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: customers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: |
          pip install playwright playwright-stealth httpx anthropic
          python -m playwright install --with-deps chrome

      - name: 執行客戶開發雷達
        env:
          METALS_DATA_DIR: data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_customers.py

      - name: 提交名單與儀表板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/customers.json docs/customers.html || true
          git commit -m "更新客戶名單 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "無變更"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

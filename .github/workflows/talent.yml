name: 金屬加工人才行情 (功能 A · 實驗版)

on:
  schedule:
    - cron: "0 0 * * *"       # UTC 00:00 = 台灣 08:00
  workflow_dispatch:          # 允許在 Actions 頁面手動觸發測試

permissions:
  contents: write             # commit 職缺快照 + jobs.html 回 repo
  pages: write                # 部署 GitHub Pages
  id-token: write             # Pages 部署驗證

concurrency:
  group: talent
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: |
          pip install playwright playwright-stealth httpx anthropic
          python -m playwright install --with-deps chrome

      - name: 執行公開職缺行情追蹤
        env:
          METALS_DATA_DIR: data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 免費（推薦）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 選配，付費
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_talent.py

      - name: 提交職缺快照與儀表板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json docs/jobs.html || true
          git commit -m "更新職缺行情 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "無變更"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: 上傳 Pages 產物（含 index.html + jobs.html）
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: 測試（不部署）

# 任何分支推送、任何 PR 都跑一次全部測試；只檢查，不產生也不部署網站。
on:
  push:
    branches-ignore: [main]     # main 的測試已含在 metals.yml 的部署流程裡
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p "test_*.py"

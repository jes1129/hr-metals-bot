name: 銅鋁監控 (功能 B)

on:
  schedule:
    - cron: "0 2,14 * * *"   # UTC 02:00 & 14:00 = 台灣 10:00 & 22:00
  workflow_dispatch:          # 允許在 Actions 頁面手動觸發
  push:
    branches: [main]
    paths-ignore:             # 機器人自己 commit 的資料/儀表板不再觸發（防迴圈）
      - "data/**"
      - "docs/**"

permissions:
  contents: write             # commit 歷史回 repo
  pages: write                # 部署 GitHub Pages
  id-token: write             # Pages 部署驗證

concurrency:
  group: metals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴
        run: pip install httpx    # LME(Westmetall)+匯率皆用 httpx，不需瀏覽器

      - name: 執行銅鋁監控
        env:
          METALS_DATA_DIR: data
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_metals.py

      - name: 提交歷史
        # 註：本步驟不設 continue-on-error——先前設了之後，git add 失敗被靜默吞掉，
        # 排程連續三週回報成功卻沒有任何產出。推送撞車已由各行的 || 個別處理。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main || git rebase --abort || true
          git stash pop || true
          # 以 -A 收整個目錄，避免清單中任一檔案不存在就讓 git add 回 128、
          # 連帶使後面的 commit/push 被 bash -e 中斷（曾導致資料三週未更新而排程仍報成功）。
          git add -A data docs
          git commit -m "更新銅鋁報價 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "無變更"
          git push origin HEAD:main || echo "push 跳過（與其他推送撞車，不影響本次部署）"

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

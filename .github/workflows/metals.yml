name: 銅鋁監控 (功能 B)

on:
  schedule:
    - cron: "0 2,14 * * *"   # UTC 02:00 & 14:00 = 台灣 10:00 & 22:00
  workflow_dispatch:          # 允許在 Actions 頁面手動觸發
  push:
    branches: [main]
    paths-ignore:             # 機器人自己 commit 的資料/儀表板不再觸發（防迴圈）
      - "data/**"
      - "docs/**"

permissions:
  contents: write             # commit 歷史回 repo
  pages: write                # 部署 GitHub Pages
  id-token: write             # Pages 部署驗證

concurrency:
  group: metals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: pip install httpx    # LME(Westmetall)+匯率皆用 httpx，不需瀏覽器

      - name: 執行銅鋁監控
        env:
          METALS_DATA_DIR: data
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_metals.py

      - name: 提交歷史
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/daily.json docs/index.html docs/metals.html docs/quote.html docs/help.html docs/db.html docs/orders.html
          git commit -m "更新銅鋁報價 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "無變更"
          git pull --rebase origin main || true   # 防併發推送導致 non-fast-forward
          git push origin HEAD:main

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
